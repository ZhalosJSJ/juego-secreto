<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Reproductor</title>
  <style>
    :root {
      color-scheme: dark;
      --fondo: #0b1220; --tinta: #d9e8ff; --tenue: #8fa6c8; --pista: #1a2740;
      --acento: #86e6ff; --sobre-acento: #06101c; --radio: 10px;
      --fuente: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      position: relative; overflow: hidden; background: var(--fondo); color: var(--tinta);
      font: 14px/1.35 var(--fuente); cursor: default; user-select: none;
    }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    button:disabled { opacity: .3; cursor: default; }
    svg { display: block; fill: currentColor; }

    /* ——— Estructura común ——— */
    .fondo { position: absolute; inset: -10%; background: center / cover no-repeat; filter: blur(28px) saturate(1.3); opacity: 0; transition: opacity .6s; pointer-events: none; }
    .fondo.con-arte { opacity: .18; }
    [data-diseno="minimo"] .fondo.con-arte { opacity: .12; }
    .reproductor {
      position: absolute; inset: 0; display: grid; padding: 14px; gap: 6px 12px;
      grid-template-columns: auto minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto;
      grid-template-areas: "arte info" "linea linea" "controles controles";
    }
    .arte { grid-area: arte; position: relative; width: 84px; height: 84px; border-radius: var(--radio); overflow: hidden; background: var(--pista); align-self: center; }
    .arte img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .arte img[hidden] { display: none; }
    .sin-arte { position: absolute; inset: 0; display: grid; place-items: center; color: var(--tenue); }
    .arte img:not([hidden]) + .sin-arte { display: none; }
    .info { grid-area: info; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
    .fuente { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); display: flex; align-items: center; gap: 6px; }
    .fuente select { font: inherit; color: inherit; background: transparent; border: 0; padding: 0 18px 0 0; letter-spacing: inherit; text-transform: inherit; cursor: pointer; max-width: 100%; appearance: none; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%238fa6c8"><path d="M7 10l5 5 5-5z"/></svg>') right center / 16px no-repeat; }
    .fuente .medida { position: absolute; visibility: hidden; white-space: nowrap; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .fuente select option { background: var(--fondo); color: var(--tinta); text-transform: none; letter-spacing: 0; }
    .titulo { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; }
    .titulo span { display: inline-block; }
    .titulo.largo span { animation: desplazar 14s ease-in-out infinite; }
    @keyframes desplazar { 0%, 15% { transform: translateX(0); } 85%, 100% { transform: translateX(var(--d)); } }
    .artista, .album { color: var(--tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .album { font-size: 12px; }
    .linea { grid-area: linea; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 11px; color: var(--tenue); font-variant-numeric: tabular-nums; }
    .barra { height: 4px; border-radius: 2px; background: var(--pista); position: relative; cursor: pointer; }
    .barra::before { content: ""; position: absolute; inset: -8px 0; }  /* zona de clic más alta */
    .barra i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 2px; background: var(--acento); }
    .controles { grid-area: controles; display: flex; justify-content: center; align-items: center; gap: 14px; }
    .controles button { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
    .controles button:not(:disabled):hover { background: rgba(255, 255, 255, .08); }
    #alternar { width: 40px; height: 40px; background: var(--acento); color: var(--sobre-acento); }
    #alternar:not(:disabled):hover { background: var(--acento); filter: brightness(1.1); }
    .icono-pausa, [data-estado="reproduciendo"] .icono-play { display: none; }
    [data-estado="reproduciendo"] .icono-pausa { display: block; }
    .extras { position: absolute; top: 6px; right: 6px; display: flex; gap: 2px; opacity: .5; transition: opacity .2s; }
    body:hover .extras { opacity: .9; }
    .extras button { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; }
    .extras button:hover { background: rgba(255, 255, 255, .1); }
    .eq { display: none; }

    /* ——— Diseño: vinilo ——— */
    [data-diseno="vinilo"] { --fondo: #15100e; --tinta: #f6e9dc; --tenue: #a8927f; --pista: #2a211d; --acento: #ffb86b; --sobre-acento: #1a120c; }
    [data-diseno="vinilo"] .arte { width: 104px; height: 104px; border-radius: 50%; background: radial-gradient(circle, #2a2a2a 0 22%, #0d0d0d 23% 100%); overflow: visible; }
    [data-diseno="vinilo"] .arte::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: repeating-radial-gradient(circle, rgba(255, 255, 255, .06) 0 1px, transparent 1px 4px); pointer-events: none; }
    [data-diseno="vinilo"] .arte img, [data-diseno="vinilo"] .sin-arte { position: absolute; inset: 20%; width: 60%; height: 60%; border-radius: 50%; }
    [data-diseno="vinilo"] .arte::after { content: ""; position: absolute; inset: 47%; border-radius: 50%; background: var(--fondo); }
    [data-diseno="vinilo"][data-estado="reproduciendo"] .arte { animation: girar 5s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }
    [data-diseno="vinilo"] .titulo { font-family: Georgia, "Times New Roman", serif; font-size: 17px; }
    [data-diseno="vinilo"] .barra i { background: linear-gradient(90deg, #d98b4a, var(--acento)); }

    /* ——— Diseño: mínimo (una sola fila) ——— */
    [data-diseno="minimo"] .reproductor {
      padding: 8px 10px; gap: 0 10px; align-items: center;
      grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: 1fr; grid-template-areas: "arte info controles";
    }
    [data-diseno="minimo"] .arte { width: 40px; height: 40px; border-radius: 6px; }
    [data-diseno="minimo"] .titulo { font-size: 14px; }
    [data-diseno="minimo"] .artista { font-size: 12px; }
    [data-diseno="minimo"] .album, [data-diseno="minimo"] .fuente, [data-diseno="minimo"] #anterior, [data-diseno="minimo"] .linea span { display: none; }
    [data-diseno="minimo"] .linea { position: absolute; left: 0; right: 0; bottom: 0; display: block; }
    [data-diseno="minimo"] .barra { height: 3px; border-radius: 0; background: transparent; }
    [data-diseno="minimo"] .controles { gap: 2px; margin-right: 54px; }
    [data-diseno="minimo"] #alternar { width: 32px; height: 32px; }
    [data-diseno="minimo"] .extras { top: 50%; transform: translateY(-50%); }

    /* ——— Diseño: portada (la carátula de fondo) ——— */
    [data-diseno="portada"] { --tinta: #fff; --tenue: rgba(255, 255, 255, .72); --pista: rgba(255, 255, 255, .25); --acento: #fff; --sobre-acento: #111; }
    [data-diseno="portada"] .fondo { inset: 0; filter: none; }
    [data-diseno="portada"] .fondo.con-arte { opacity: 1; }
    [data-diseno="portada"] .fondo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, .05) 0%, rgba(0, 0, 0, .35) 45%, rgba(0, 0, 0, .85) 100%); }
    [data-diseno="portada"] .reproductor { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "info info" "linea linea" "controles controles"; align-content: end; text-shadow: 0 1px 6px rgba(0, 0, 0, .7); }
    [data-diseno="portada"] .arte { display: none; }
    [data-diseno="portada"] .info { justify-content: end; }
    [data-diseno="portada"] .titulo { font-size: 18px; }
    [data-diseno="portada"] .controles { justify-content: flex-end; }
    [data-diseno="portada"] .extras { filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .8)); }

    /* ——— Diseño: neón ——— */
    [data-diseno="neon"] { --fondo: #05060b; --tinta: #eafcff; --tenue: #6fb3c4; --pista: #121a2b; --acento: #39ffe0; --sobre-acento: #04110f; --fuente: "Cascadia Mono", Consolas, "Courier New", monospace; }
    [data-diseno="neon"] .arte { border-radius: 4px; box-shadow: 0 0 0 1px #ff3fd8, 0 0 14px rgba(255, 63, 216, .55); }
    [data-diseno="neon"] .titulo { color: #ff3fd8; text-shadow: 0 0 8px rgba(255, 63, 216, .8); text-transform: uppercase; font-size: 15px; letter-spacing: .04em; }
    [data-diseno="neon"] .artista { color: var(--acento); text-shadow: 0 0 8px rgba(57, 255, 224, .6); }
    [data-diseno="neon"] .barra i { background: linear-gradient(90deg, #ff3fd8, var(--acento)); box-shadow: 0 0 8px rgba(57, 255, 224, .7); }
    [data-diseno="neon"] #alternar { box-shadow: 0 0 14px rgba(57, 255, 224, .6); }
    [data-diseno="neon"] .eq { display: flex; gap: 3px; align-items: flex-end; height: 18px; position: absolute; right: 14px; bottom: 16px; }
    [data-diseno="neon"] .eq i { width: 4px; height: 4px; background: var(--acento); box-shadow: 0 0 6px rgba(57, 255, 224, .8); border-radius: 1px; }
    [data-diseno="neon"][data-estado="reproduciendo"] .eq i { animation: saltar .7s ease-in-out infinite alternate; }
    [data-diseno="neon"] .eq i:nth-child(2) { animation-delay: -.2s; } [data-diseno="neon"] .eq i:nth-child(3) { animation-delay: -.45s; }
    [data-diseno="neon"] .eq i:nth-child(4) { animation-delay: -.1s; } [data-diseno="neon"] .eq i:nth-child(5) { animation-delay: -.35s; }
    @keyframes saltar { from { height: 3px; } to { height: 18px; } }

    /* ——— Mezclador ——— */
    .mezclador { position: absolute; inset: 0; background: color-mix(in srgb, var(--fondo) 94%, black); display: flex; flex-direction: column; padding: 10px 12px; gap: 6px; }
    .mezclador[hidden] { display: none; }
    .mezclador header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); }
    .mezclador header button { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; }
    .lista { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; scrollbar-width: thin; }
    .fila { display: grid; grid-template-columns: 22px minmax(0, 1fr) 96px 24px; align-items: center; gap: 8px; padding: 2px 0; }
    .fila.inactivo { opacity: .55; }
    .fila .icono { width: 20px; height: 20px; border-radius: 4px; object-fit: contain; }
    .fila .generico { display: grid; place-items: center; color: var(--tenue); }
    .fila .nombre { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
    .fila.general .nombre { font-weight: 600; }
    .pico { height: 2px; background: var(--pista); border-radius: 1px; margin-top: 3px; overflow: hidden; }
    .pico i { display: block; height: 100%; width: 0; background: var(--acento); transition: width .12s linear; }
    .fila input[type=range] { width: 100%; accent-color: var(--acento); margin: 0; }
    .fila .silencio { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--tenue); }
    .fila.silenciado .silencio { color: #ff8a98; }
    .fila.silenciado input[type=range] { opacity: .4; }
    .vacio { color: var(--tenue); font-size: 13px; margin: 8px 0; }
  </style>
</head>
<body data-diseno="tarjeta" data-estado="nada">
  <div class="fondo" id="fondo"></div>

  <main class="reproductor">
    <div class="arte">
      <img id="arte" alt="" hidden>
      <div class="sin-arte"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></div>
    </div>
    <div class="info">
      <div class="fuente"><span id="fuente"></span><select id="sesiones" hidden></select></div>
      <div class="titulo" id="titulo"><span>Nada en reproducción</span></div>
      <div class="artista" id="artista">Abra Spotify, YouTube o cualquier reproductor</div>
      <div class="album" id="album"></div>
    </div>
    <div class="linea">
      <span id="t-pos">0:00</span>
      <div class="barra" id="barra" title="Ir a este punto"><i id="progreso"></i></div>
      <span id="t-dur">0:00</span>
    </div>
    <div class="controles">
      <button id="anterior" title="Anterior" disabled><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button id="alternar" title="Reproducir o pausar (Espacio)" disabled>
        <svg class="icono-play" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icono-pausa" viewBox="0 0 24 24" width="22" height="22"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button id="siguiente" title="Siguiente" disabled><svg viewBox="0 0 24 24" width="20" height="20"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
    <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="extras">
      <button id="b-volumen" title="Volúmenes de las aplicaciones"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
      <button id="b-diseno" title="Cambiar diseño"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18V4a8 8 0 0 1 0 16z"/></svg></button>
    </div>
  </main>

  <section class="mezclador" id="mezclador" hidden>
    <header><span>Volúmenes</span><button id="cerrar" title="Cerrar"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L12 13.4l-6.3 6.3-1.4-1.4L10.6 12 4.3 5.7l1.4-1.4L12 10.6l6.3-6.3z"/></svg></button></header>
    <div class="lista" id="lista"></div>
  </section>

  <script>
    const puente = window.chrome && window.chrome.webview;
    const enviar = mensaje => { if (puente) puente.postMessage(mensaje); };
    const $ = id => document.getElementById(id);
    const DISENOS = ['tarjeta', 'vinilo', 'minimo', 'portada', 'neon'];

    // ——— Diseño: el de «opciones» en config.json manda cuando cambia; si no, el último elegido con el botón.
    (function elegirDiseno() {
      const pedido = new URLSearchParams(location.search).get('diseno');
      let diseno = localStorage.getItem('diseno');
      if (pedido && DISENOS.includes(pedido) && localStorage.getItem('disenoConfig') !== pedido) {
        localStorage.setItem('disenoConfig', pedido);
        diseno = pedido;
      }
      aplicarDiseno(DISENOS.includes(diseno) ? diseno : 'tarjeta');
    })();
    function aplicarDiseno(diseno) {
      document.body.dataset.diseno = diseno;
      localStorage.setItem('diseno', diseno);
      $('b-diseno').title = `Diseño: ${diseno} (clic para cambiar)`;
      ajustarTitulo();
    }
    $('b-diseno').addEventListener('click', () => aplicarDiseno(DISENOS[(DISENOS.indexOf(document.body.dataset.diseno) + 1) % DISENOS.length]));

    // ——— Estado del reproductor
    let linea = { posicion: 0, duracion: 0, actualizado: 0, reproduciendo: false };

    function pintar(d) {
      document.body.dataset.estado = d.estado;
      const hay = d.estado !== 'nada';
      $('titulo').firstElementChild.textContent = hay ? (d.titulo || 'Sin título') : 'Nada en reproducción';
      $('artista').textContent = hay ? d.artista : 'Abra Spotify, YouTube o cualquier reproductor';
      $('album').textContent = hay ? (d.album || '') : '';
      $('fuente').textContent = hay ? d.fuente : '';
      ajustarTitulo();
      pintarSesiones(d.sesiones || []);
      if (d.caratulaNueva || !hay) pintarCaratula(hay ? d.caratula : null);
      const c = d.controles || {};
      $('alternar').disabled = !hay || !c.alternar;
      $('siguiente').disabled = !hay || !c.siguiente;
      $('anterior').disabled = !hay || !c.anterior;
      $('barra').style.cursor = c.ir ? 'pointer' : 'default';
      // Si la app informa una hora rara (algunas mandan 1970), se cuenta desde ahora.
      const ahora = Date.now();
      const actualizado = d.actualizado && Math.abs(ahora - d.actualizado) < 86400000 ? d.actualizado : ahora;
      linea = { posicion: d.posicion || 0, duracion: d.duracion || 0, actualizado, reproduciendo: d.estado === 'reproduciendo', ir: !!c.ir };
      pintarLinea();
    }

    // La carátula va en la imagen y, difuminada, de fondo (en «portada» es el fondo entero: lo decide el CSS).
    function pintarCaratula(datos) {
      const img = $('arte');
      if (datos) { img.src = datos; img.hidden = false; $('fondo').style.backgroundImage = `url("${datos}")`; }
      else { img.removeAttribute('src'); img.hidden = true; $('fondo').style.backgroundImage = ''; }
      $('fondo').classList.toggle('con-arte', !!datos);
    }

    function pintarSesiones(sesiones) {
      const select = $('sesiones');
      const varias = sesiones.length > 1;
      select.hidden = !varias;
      $('fuente').hidden = varias;
      if (!varias) return;
      const actual = sesiones.find(s => s.actual);
      select.replaceChildren(...sesiones.map(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.nombre; o.selected = s.actual; return o; }));
      select.title = actual ? `Sonando en ${actual.nombre}. Elija otra app` : 'Elija la app';
      // Tan ancho como el nombre elegido (si no, Chromium lo hace tan ancho como la opción más larga).
      let medida = select.parentElement.querySelector('.medida');
      if (!medida) { medida = document.createElement('span'); medida.className = 'medida'; select.parentElement.appendChild(medida); }
      medida.textContent = actual ? actual.nombre : '';
      select.style.width = `${medida.offsetWidth + 20}px`;
    }
    $('sesiones').addEventListener('change', () => enviar({ accion: 'elegir', sesion: $('sesiones').value }));

    function ajustarTitulo() {
      const caja = $('titulo'), texto = caja.firstElementChild;
      texto.style.setProperty('--d', '0px');
      caja.classList.remove('largo');
      const sobra = texto.scrollWidth - caja.clientWidth;
      if (sobra > 4) { texto.style.setProperty('--d', `${-sobra - 8}px`); caja.classList.add('largo'); }
    }
    addEventListener('resize', ajustarTitulo);

    function tiempo(s) { s = Math.max(0, Math.floor(s)); const m = Math.floor(s / 60), h = Math.floor(m / 60); return (h ? `${h}:${String(m % 60).padStart(2, '0')}:` : `${m}:`) + String(s % 60).padStart(2, '0'); }
    function posicionActual() { const p = linea.posicion + (linea.reproduciendo ? (Date.now() - linea.actualizado) / 1000 : 0); return linea.duracion ? Math.min(p, linea.duracion) : p; }
    function pintarLinea() {
      const p = posicionActual();
      $('t-pos').textContent = tiempo(p);
      $('t-dur').textContent = linea.duracion ? tiempo(linea.duracion) : '--:--';
      $('progreso').style.width = linea.duracion ? `${(p / linea.duracion) * 100}%` : '0';
    }
    setInterval(pintarLinea, 250);

    $('barra').addEventListener('click', e => {
      if (!linea.ir || !linea.duracion) return;
      const r = $('barra').getBoundingClientRect();
      const fraccion = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
      enviar({ accion: 'ir', posicion: fraccion * linea.duracion });
      linea.posicion = fraccion * linea.duracion; linea.actualizado = Date.now(); pintarLinea();
    });
    $('alternar').addEventListener('click', () => enviar({ accion: 'alternar' }));
    $('siguiente').addEventListener('click', () => enviar({ accion: 'siguiente' }));
    $('anterior').addEventListener('click', () => enviar({ accion: 'anterior' }));
    addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.code === 'Space') { e.preventDefault(); if (!$('alternar').disabled) enviar({ accion: 'alternar' }); }
      else if (e.code === 'ArrowRight' && !$('siguiente').disabled) enviar({ accion: 'siguiente' });
      else if (e.code === 'ArrowLeft' && !$('anterior').disabled) enviar({ accion: 'anterior' });
      else if (e.code === 'Escape' && !$('mezclador').hidden) abrirMezclador(false);
    });

    // ——— Mezclador: se pide mientras está abierto (los niveles y el medidor cambian todo el tiempo).
    let relojMezclador = null;
    const arrastrando = new Set();   // claves cuyo deslizador está en uso: no se pisan con lo que llega
    let ultimoEnvio = {};
    function abrirMezclador(abrir) {
      $('mezclador').hidden = !abrir;
      clearInterval(relojMezclador);
      if (abrir) { enviar({ pedir: 'mezclador' }); relojMezclador = setInterval(() => enviar({ pedir: 'mezclador' }), 300); }
    }
    $('b-volumen').addEventListener('click', () => abrirMezclador($('mezclador').hidden));
    $('cerrar').addEventListener('click', () => abrirMezclador(false));

    const ICONO_SILENCIO = '<svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3 2.8-2.8-1.4-1.4L15 10.6l-2.9-2.8-1.4 1.4L13.6 12l-2.9 2.8 1.4 1.4 2.9-2.8 2.9 2.8 1.4-1.4z"/></svg>';
    const ICONO_SONIDO = '<svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>';
    const ICONO_GENERAL = '<svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3a9 9 0 0 0-9 9v7h5v-7H5a7 7 0 0 1 14 0h-3v7h5v-7a9 9 0 0 0-9-9z"/></svg>';

    function pintarMezclador(d) {
      const filas = [{ clave: '*', nombre: 'General', nivel: d.general.nivel, silencio: d.general.silencio, pico: d.general.pico, activo: true, general: true }]
        .concat(d.programas || []);
      const lista = $('lista');
      const vistas = new Set();
      for (const p of filas) {
        vistas.add(p.clave);
        let fila = lista.querySelector(`[data-clave="${CSS.escape(p.clave)}"]`);
        if (!fila) {
          fila = document.createElement('div');
          fila.className = 'fila';
          fila.dataset.clave = p.clave;
          fila.innerHTML = `<span class="icono generico">${p.general ? ICONO_GENERAL : '♪'}</span>`
            + '<div><div class="nombre"></div><div class="pico"><i></i></div></div>'
            + '<input type="range" min="0" max="100" step="1">'
            + `<button class="silencio" title="Silenciar">${ICONO_SONIDO}</button>`;
          if (p.icono) { const img = document.createElement('img'); img.className = 'icono'; img.src = p.icono; img.alt = ''; fila.firstElementChild.replaceWith(img); }
          const rango = fila.querySelector('input');
          rango.addEventListener('pointerdown', () => arrastrando.add(p.clave));
          rango.addEventListener('pointerup', () => arrastrando.delete(p.clave));
          rango.addEventListener('pointercancel', () => arrastrando.delete(p.clave));
          rango.addEventListener('input', () => cambiarVolumen(p.clave, rango.value / 100));
          fila.querySelector('.silencio').addEventListener('click', () => enviar({ silencio: { app: p.clave, valor: !fila.classList.contains('silenciado') } }));
          lista.appendChild(fila);
        }
        fila.classList.toggle('general', !!p.general);
        fila.classList.toggle('inactivo', !p.activo && !p.general);
        fila.classList.toggle('silenciado', !!p.silencio);
        fila.querySelector('.nombre').textContent = p.nombre;   // el nombre viene del programa: como texto, nunca HTML
        fila.querySelector('.silencio').innerHTML = p.silencio ? ICONO_SILENCIO : ICONO_SONIDO;
        fila.querySelector('.silencio').title = p.silencio ? 'Activar sonido' : 'Silenciar';
        fila.querySelector('.pico i').style.width = `${Math.min(100, Math.round((p.pico || 0) * 100))}%`;
        if (!arrastrando.has(p.clave)) fila.querySelector('input').value = Math.round((p.nivel || 0) * 100);
      }
      for (const fila of [...lista.children]) if (!vistas.has(fila.dataset.clave)) fila.remove();
      // Las filas se mantienen en el orden que manda la app (activas primero).
      filas.forEach((p, i) => { const fila = lista.querySelector(`[data-clave="${CSS.escape(p.clave)}"]`); if (fila && lista.children[i] !== fila) lista.insertBefore(fila, lista.children[i]); });
      let vacio = lista.querySelector('.vacio');
      if (filas.length === 1) { if (!vacio) { vacio = document.createElement('p'); vacio.className = 'vacio'; vacio.textContent = 'Ningún programa está usando el sonido.'; lista.appendChild(vacio); } }
      else if (vacio) vacio.remove();
    }

    // No más de un envío cada 60 ms por programa; el último valor siempre llega.
    function cambiarVolumen(clave, nivel) {
      const ahora = Date.now();
      const u = ultimoEnvio[clave] || { t: 0, pendiente: null };
      if (ahora - u.t >= 60) { enviar({ volumen: { app: clave, nivel } }); u.t = ahora; u.pendiente = null; }
      else { u.pendiente = nivel; clearTimeout(u.temporizador); u.temporizador = setTimeout(() => { if (u.pendiente !== null) { enviar({ volumen: { app: clave, nivel: u.pendiente } }); u.t = Date.now(); u.pendiente = null; } }, 60); }
      ultimoEnvio[clave] = u;
    }

    // ——— Conexión con la app
    if (puente) puente.addEventListener('message', e => {
      const d = e.data;
      if (!d || typeof d !== 'object') return;
      if (d.tipo === 'reproductor') pintar(d);
      else if (d.tipo === 'mezclador' && !$('mezclador').hidden) pintarMezclador(d);
    });
    enviar({ pedir: 'reproductor' });
  </script>
</body>
</html>
