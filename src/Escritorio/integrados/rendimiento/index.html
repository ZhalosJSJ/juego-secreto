<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Rendimiento</title>
  <link rel="stylesheet" href="../comun/estilo.css">
  <script src="../comun/puente.js"></script>
  <style>
    body { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
    .fila { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; column-gap: 10px; row-gap: 4px; }
    .fila[hidden] { display: none; }
    .fila .barra { grid-column: 1 / 4; }
    .detalle { color: var(--tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="fila" id="cpu"><span class="encabezado">CPU</span><span class="detalle">Procesador</span><span class="valor">—</span><div class="barra"><i></i></div></div>
  <div class="fila" id="ram"><span class="encabezado">RAM</span><span class="detalle">—</span><span class="valor">—</span><div class="barra"><i></i></div></div>
  <div class="fila" id="gpu" hidden><span class="encabezado">GPU</span><span class="detalle">—</span><span class="valor">—</span><div class="barra"><i></i></div></div>
  <p class="vacio" id="vacio">Midiendo…</p>

  <script>
    const gb = bytes => (bytes / 1073741824).toFixed(1);

    function pintar(id, porcentaje, detalle, valor) {
      const fila = document.getElementById(id);
      fila.hidden = false;
      fila.className = 'fila' + (porcentaje >= 90 ? ' alto' : porcentaje >= 70 ? ' medio' : '');
      fila.querySelector('.detalle').textContent = detalle;
      fila.querySelector('.valor').textContent = valor;
      fila.querySelector('.barra i').style.width = `${Math.max(0, Math.min(100, porcentaje || 0))}%`;
    }

    Escritorio.al('rendimiento', d => {
      document.getElementById('vacio').hidden = true;
      if (Number.isFinite(d.cpu)) pintar('cpu', d.cpu, 'Procesador', `${d.cpu} %`);
      if (d.ram) {
        const uso = (d.ram.usada / d.ram.total) * 100;
        pintar('ram', uso, `${gb(d.ram.usada)} de ${gb(d.ram.total)} GB`, `${Math.round(uso)} %`);
      }
      if (d.gpu) {
        // El nombre completo va en el título; en la fila, lo que cambia: VRAM y temperatura.
        const partes = [];
        if (d.gpu.vram) partes.push(`VRAM ${gb(d.gpu.vram.usada)} de ${gb(d.gpu.vram.total)} GB`);
        if (d.gpu.temperatura) partes.push(`${d.gpu.temperatura} °C`);
        const nombre = (d.gpu.nombre || 'GPU').replace(/^NVIDIA (GeForce )?/i, '');
        pintar('gpu', d.gpu.uso, partes.join(' · ') || nombre, `${d.gpu.uso} %`);
        document.getElementById('gpu').title = d.gpu.nombre || '';
      } else {
        document.getElementById('gpu').hidden = true;
      }
    });
    Escritorio.pedir('rendimiento');
  </script>
</body>
</html>
