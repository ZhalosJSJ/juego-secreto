# Compila Escritorio.exe en Windows en cada push y lo deja como artefacto descargable.
# Con una etiqueta v* (por ejemplo v0.2.0) además publica una versión con el .exe adjunto.
name: Compilar

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pruebas
        run: dotnet test pruebas/Escritorio.Pruebas -c Release

      - name: Publicar el .exe
        run: dotnet publish src/Escritorio -c Release -o publicado

      - uses: actions/upload-artifact@v4
        with:
          name: Escritorio
          path: publicado/Escritorio.exe
          if-no-files-found: error

      - name: Publicar la versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publicado/Escritorio.exe
